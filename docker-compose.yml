services:
  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: Bacheca
    volumes:
      - bacheca_data:/var/lib/mysql
      - ./bacheca.sql:/docker-entrypoint-initdb.d/bacheca.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p0000"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: "0000"
      DB_NAME: Bacheca
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bacheca_data:
